<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team availability</title>
<style>
:root{--line:#e5e7eb;--line2:#d1d5db;--muted:#6b7280;--ink:#111827;--accent:#15803d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:10px 16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px}
button{border:1px solid var(--line2);background:#fff;padding:5px 12px;border-radius:7px;font:inherit;cursor:pointer;color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select{font:inherit;padding:4px 6px;border:1px solid var(--line2);border-radius:7px;background:#fff}
.sp{flex:1}.muted{color:var(--muted)}
.best{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:13px}
.best b{font-weight:600;margin-right:2px}.chip{background:#dcfce7;color:#14532d;border-radius:999px;padding:2px 10px;font-weight:500}
.chip.p{background:#f3f4f6;color:var(--ink)}
.edit{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}.edit select{padding:3px 6px}
.grid{display:grid;flex:1;min-height:0;user-select:none;-webkit-user-select:none;touch-action:none}
.th{font-size:12px;color:var(--muted);padding-left:3px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line2)}
.dl{display:flex;align-items:center;gap:6px;padding-right:10px;white-space:nowrap}.dl b{font-weight:600}.dl span{color:var(--muted);font-size:12px}
.dl.today b,.dl.today span{color:var(--accent);font-weight:700}
.c{position:relative;cursor:pointer;border-bottom:3px solid #fff;border-left:1px solid #fff}.c.h{border-left:1px solid var(--line2)}
.c.past{opacity:.3}
.c.hand::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.6}
.c:hover{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
.sw{display:inline-flex;gap:5px;align-items:center}.sw i{width:16px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;max-width:260px;display:none;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tip .t{font-weight:600;margin-bottom:2px}#tip .no{color:#9ca3af}
.msg{padding:16px;color:var(--muted)}
</style></head><body><div id="app"><div class="msg">Loading…</div></div><div id="tip"></div>
<script>
const STORE='https://script.google.com/macros/s/AKfycbxdixStSu3zncVM3f5IGjCnBj8k5IETum99bqpKmxL0cz4gqiaVctHNbqVLo081nu6c4A/exec';
const K=new URLSearchParams(location.search).get('k')||'';
const TZ='America/Los_Angeles',SLOT=30*60e3,H0=9,H1=23;
// Five clearly different steps: nobody (gray) -> everyone (dark green)
const PAL=['#eceff3','#d1fadf','#86e0a6','#2fb463','#0f6b35'];
const MINE_FREE='#2fb463',MINE_BUSY='#eceff3';
let S=null,week=0,me=null,editing=false,drag=null,pending=0;
try{me=localStorage.getItem('ta_me')||null}catch(e){}
const app=document.getElementById('app'),tip=document.getElementById('tip');
const fmt=(ms,o)=>new Intl.DateTimeFormat('en-US',Object.assign({timeZone:TZ},o)).format(new Date(ms));
const tm=ms=>fmt(ms,{hour:'numeric',minute:'2-digit'}).replace(' ','').replace(':00','').toLowerCase();
const shade=(k,n)=>PAL[k<=0?0:k>=n?4:Math.max(1,Math.min(3,Math.round(k/n*4)))];
function laMidnight(ymd){const g=new Date(ymd+'T12:00:00Z');const off=new Intl.DateTimeFormat('en-US',{timeZone:TZ,timeZoneName:'longOffset'}).format(g).match(/GMT([+-]\d\d):?(\d\d)?/);if(!off)return Date.parse(ymd+'T00:00:00Z');const sign=off[1][0]==='-'?-1:1;const mins=sign*(Math.abs(+off[1])*60+(+(off[2]||0)));return Date.parse(ymd+'T00:00:00Z')-mins*60e3}
function ymd(ms){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date(ms))}
function days(){const out=[];const t0=laMidnight(ymd(Date.now()));const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(fmt(t0,{weekday:'short'}));
 const toSun=(7-dow)%7;let start,n;if(week===0){start=t0;n=toSun+1}else{start=laMidnight(ymd(t0+(toSun+1)*86400e3+3600e3));n=7}
 for(let i=0;i<n;i++)out.push(laMidnight(ymd(start+i*86400e3+3600e3)));return out}
const slotsOf=d=>{const a=[];for(let i=0;i<(H1-H0)*2;i++)a.push(d+(H0*60+i*30)*60e3);return a};
function calFree(p,s){const b=(S.busy&&S.busy.busy[p])||[];for(const [a,z] of b)if(a<s+SLOT&&z>s)return false;return true}
function isFree(p,s){const m=(S.marks[p]||{})[s];if(m==='f')return true;if(m==='b')return false;return calFree(p,s)}
// Upcoming blocks of at least 1 hour where everyone (or, failing that, all but one) is free
function bestTimes(ds){const ppl=S.people,now=Date.now();
 const find=need=>{const out=[];ds.forEach(d=>{let st=null,run=[];slotsOf(d).concat([null]).forEach(s=>{const ok=s!==null&&s>=now-SLOT/2&&ppl.filter(p=>isFree(p,s)).length>=need;
  if(ok){if(st===null)st=s;run.push(s)}else if(st!==null){if(run.length>=2)out.push([st,run[run.length-1]+SLOT]);st=null;run=[]}})});return out};
 let r=find(ppl.length);if(r.length)return{all:true,r};return{all:false,r:find(ppl.length-1)}}
function render(){
 if(!S)return;
 const ppl=S.people,ds=days(),rows=(H1-H0)*2,now=Date.now(),todayK=ymd(now);
 if(me&&!ppl.includes(me))me=null;
 let html='<div class="bar"><span class="tabs"><button data-w="0" class="'+(week===0?'on':'')+'">This week</button> <button data-w="1" class="'+(week===1?'on':'')+'">Next week</button></span><span class="sp"></span>';
 if(!editing)html+='<button class="go" id="ed">Edit my times</button>';
 else html+='<span class="edit"><span>Editing as</span><select id="me"><option value="">pick your name</option>'+ppl.map(p=>'<option'+(p===me?' selected':'')+'>'+p+'</option>').join('')+'</select><button id="rs">Reset to my calendar</button><button class="go" id="dn">Done</button></span>';
 html+='</div>';
 if(editing)html+='<div class="best"><span><b>Click or drag</b> to flip a time between <b style="color:#15803d">free</b> and <b>busy</b>. It saves for everyone right away.</span></div>';
 else{const b=bestTimes(ds);const lim=b.r.slice(0,5);
  html+='<div class="best"><b>'+(b.all?'Everyone free:':lim.length?'No time with all '+ppl.length+' free. '+(ppl.length-1)+' of '+ppl.length+' free:':'No hour this week with '+(ppl.length-1)+'+ of us free')+'</b>'+
   lim.map(([a,z])=>'<span class="chip'+(b.all?'':' p')+'">'+fmt(a,{weekday:'short'})+' '+tm(a)+'–'+tm(z)+'</span>').join('')+(b.r.length>lim.length?'<span class="muted">+'+(b.r.length-lim.length)+' more</span>':'')+'</div>'}
  html+='<div class="grid" id="g" style="grid-template-columns:96px repeat('+rows+',1fr);grid-template-rows:20px repeat('+ds.length+',minmax(18px,1fr))"><div></div>';
 for(let i=0;i<rows;i+=2)html+='<div class="th" style="grid-column:span 2">'+tm(ds[0]+(H0*60+i*30)*60e3)+'</div>';
 ds.forEach(d=>{html+='<div class="dl'+(ymd(d)===todayK?' today':'')+'"><b>'+(ymd(d)===todayK?'Today':fmt(d,{weekday:'short'}))+'</b><span>'+fmt(d,{month:'short',day:'numeric'})+'</span></div>';
  slotsOf(d).forEach((s,i)=>{let bg,hand;
   if(editing&&me){bg=isFree(me,s)?MINE_FREE:MINE_BUSY;hand=!!(S.marks[me]||{})[s]}else{bg=shade(ppl.filter(p=>isFree(p,s)).length,ppl.length);hand=false}
   html+='<div class="c'+(i%2==0?' h':'')+(s+SLOT<now?' past':'')+(hand?' hand':'')+'" data-s="'+s+'" style="background:'+bg+'"></div>'})});
 html+='</div><div class="foot">';
 if(editing&&me)html+='<span class="sw"><i style="background:'+MINE_FREE+'"></i>You\'re free</span><span class="sw"><i style="background:'+MINE_BUSY+'"></i>Busy</span><span>· Dot = you changed it by hand. Everything else comes from your Google Calendar.</span>';
 else html+='<span class="sw"><i style="background:'+PAL[0]+'"></i>Nobody</span>'+[1,2,3].filter(k=>k<ppl.length).map(k=>'<span class="sw"><i style="background:'+shade(k,ppl.length)+'"></i>'+k+' free</span>').join('')+'<span class="sw"><i style="background:'+PAL[4]+'"></i>All '+ppl.length+'</span><span>· Hover for names · From everyone\'s Google Calendars'+(S.busy?', updated '+tm(S.busy.updated):'')+'</span>';
 html+='</div>';
 app.innerHTML=html;
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{week=+b.dataset.w;render()});
 const q=id=>document.getElementById(id);
 if(q('ed'))q('ed').onclick=()=>{editing=true;render()};
 if(q('dn'))q('dn').onclick=()=>{editing=false;render()};
 if(q('me'))q('me').onchange=e=>{me=e.target.value||null;try{localStorage.setItem('ta_me',me||'')}catch(x){};render()};
 if(q('rs'))q('rs').onclick=()=>{if(!me)return nudge();const mine=S.marks[me]||{};const ws=ds.flatMap(slotsOf).filter(s=>mine[s]);if(!ws.length)return;ws.forEach(s=>delete mine[s]);render();save(ws,null)};
 const g=q('g');
 g.onpointermove=e=>{const c=document.elementFromPoint(e.clientX,e.clientY);const cell=c&&c.closest&&c.closest('.c');if(!cell){tip.style.display='none';return}const s=+cell.dataset.s;
  if(drag&&!drag.set.has(s)){drag.set.add(s);setMine(s,drag.v);cell.style.background=drag.v==='f'?MINE_FREE:MINE_BUSY;cell.classList.add('hand')}
  showTip(e,s)};
 g.onpointerleave=()=>{tip.style.display='none'};
 g.onpointerdown=e=>{const cell=e.target.closest('.c');if(!cell)return;e.preventDefault();
  if(!editing){showTip(e,+cell.dataset.s);return}
  if(!me)return nudge();const s=+cell.dataset.s;const v=isFree(me,s)?'b':'f';drag={set:new Set([s]),v};setMine(s,v);cell.style.background=v==='f'?MINE_FREE:MINE_BUSY;cell.classList.add('hand')};
}
function showTip(e,s){const ppl=S.people;const free=ppl.filter(p=>isFree(p,s)),no=ppl.filter(p=>!free.includes(p));
 let h='<div class="t">'+fmt(s,{weekday:'short',month:'short',day:'numeric'})+', '+tm(s)+'–'+tm(s+SLOT)+'</div>';
 if(editing&&me){const m=(S.marks[me]||{})[s];h+=(isFree(me,s)?'You: free':'You: busy')+'<div class="no">'+(m?'Changed by you':'From your calendar')+'</div>'}
 else h+=(free.length===ppl.length?'Everyone is free':free.length?'Free: '+free.join(', '):'<span class="no">Nobody is free</span>')+(no.length&&free.length?'<div class="no">Busy: '+no.join(', ')+'</div>':'');
 tip.innerHTML=h;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-6)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-6)+'px'}
function nudge(){const sel=document.getElementById('me');if(!sel)return;sel.style.outline='2px solid #dc2626';sel.focus();setTimeout(()=>sel.style.outline='',1500)}
// A mark equal to what the calendar already says is dropped, so the calendar stays in charge
function setMine(s,v){S.marks[me]=S.marks[me]||{};if((v==='f')===calFree(me,s))delete S.marks[me][s];else S.marks[me][s]=v}
function save(slots,v){pending++;fetch(STORE,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:K,action:'mark',person:me,slots,value:v})}).then(r=>r.json()).then(d=>{pending--;if(d.marks&&!pending&&!drag){S.marks=d.marks;render()}}).catch(()=>{pending--})}
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;const sl=[...d.set];
 const keep=sl.filter(s=>(S.marks[me]||{})[s]),clear=sl.filter(s=>!(S.marks[me]||{})[s]);render();
 if(keep.length)save(keep,d.v);if(clear.length)save(clear,null)});
function load(){if(drag||pending)return;fetch(STORE+'?k='+encodeURIComponent(K)).then(r=>r.json()).then(d=>{if(d.error){app.innerHTML='<div class="msg">This view needs its access key in the link.</div>';return}S=d;S.marks=S.marks||{};render()}).catch(()=>{if(!S)app.innerHTML='<div class="msg">Couldn\'t load availability. Try refreshing.</div>'})}
addEventListener('resize',()=>{if(!drag)render()});load();setInterval(load,60000);
</script></body></html>
