<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team availability</title>
<style>html,body{margin:0;height:100%;background:#fff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}.msg{padding:16px;color:#6b7280}</style>
</head><body><div id="app"><div class="msg">Loading…</div></div><div id="tip"></div>
<script>
// This shell stays the same. It loads the newest app.css/app.js on every open, so changes show up right away.
(function(){var v=Date.now();var l=document.createElement('link');l.rel='stylesheet';l.href='app.css?v='+v;document.head.appendChild(l);
var M=function(t){var a=document.getElementById('app');if(a&&/msg/.test(a.innerHTML))a.innerHTML='<div class="msg">'+t+'</div>'};
window.addEventListener('error',function(e){M('Error: '+(e.message||'resource failed')+' ('+(e.lineno||'')+')')},true);
var s=document.createElement('script');s.src='app.js?v='+v;s.onerror=function(){M('Couldn\'t load the app code. Try refreshing.')};s.onload=function(){M('Loading the latest availability…')};document.body.appendChild(s)})();
</script></body></html>
